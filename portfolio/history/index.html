<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>캠페인 히스토리</title>
  <meta name="description" content="어도비 계정 캠페인별 히스토리 기록장">
  <meta name="robots" content="noindex, nofollow">
  <!-- 깜빡임 방지: 화면이 그려지기 전에 저장된(또는 OS) 테마를 먼저 적용 -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="stylesheet" href="/history/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/history/" aria-label="캠페인 히스토리 홈">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text"><strong>캠페인 히스토리</strong><small>Adobe Account Log</small></span>
      </a>
      <div class="topbar__actions">
        <button type="button" id="themeSwitch" class="switch" role="switch" aria-checked="false" aria-label="다크 모드">
          <span class="switch__thumb" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="layout" id="app" hidden>
    <aside class="sidebar" aria-label="캠페인 목록">
      <div class="sidebar__head">
        <h2>캠페인</h2>
        <button type="button" id="newCampaignBtn" class="btn btn--sm">+ 새 캠페인</button>
      </div>
      <ul id="campaignList" class="campaigns"></ul>
    </aside>

    <section class="content">
      <div class="page-title" id="pageTitle" data-c="all">
        <div>
          <h1 id="titleText">전체 히스토리</h1>
          <p id="titleSub" class="muted"></p>
        </div>
        <div class="page-title__actions" id="titleActions" hidden>
          <button type="button" id="editCampaignBtn" class="btn btn--sm">이름·색상 수정</button>
          <button type="button" id="deleteCampaignBtn" class="btn btn--sm btn--danger">캠페인 삭제</button>
        </div>
      </div>

      <form id="composer" class="card composer" autocomplete="off" data-c="indigo">
        <h2 class="card__title">히스토리 기록</h2>
        <div class="composer__row">
          <label class="field">
            <span>캠페인</span>
            <select id="cSelect" required></select>
          </label>
          <label class="field">
            <span>날짜</span>
            <input type="date" id="cDate" required>
          </label>
        </div>
        <label class="field">
          <span>내용</span>
          <textarea id="cText" rows="3" maxlength="1000" required placeholder="어떤 일이 있었나요? (Ctrl+Enter 로 바로 추가)"></textarea>
        </label>
        <div class="composer__foot">
          <span id="cCount" class="muted small">0 / 1000</span>
          <button type="submit" id="cSubmit" class="btn btn--primary">히스토리 추가</button>
        </div>
      </form>

      <div class="searchbar">
        <label class="search">
          <span class="visually-hidden">히스토리 검색</span>
          <input type="search" id="q" placeholder="내용 또는 날짜로 검색  (예: 배너, 2026-11, 11월 8일)" autocomplete="off">
        </label>
        <span id="resultCount" class="muted small" aria-live="polite"></span>
      </div>

      <div id="timeline" class="timeline" aria-live="polite"></div>
    </section>
  </main>

  <!-- 캠페인 추가/수정 -->
  <dialog id="campaignDialog" class="dialog">
    <form id="campaignForm" method="dialog" autocomplete="off">
      <h2 id="cdTitle">새 캠페인</h2>
      <label class="field">
        <span>이름 (최대 40자)</span>
        <input type="text" id="cdName" maxlength="40" required>
      </label>
      <fieldset class="field">
        <legend>색상 톤</legend>
        <div id="cdColors" class="swatches" role="radiogroup" aria-label="색상 톤"></div>
      </fieldset>
      <div class="dialog__foot">
        <button type="button" id="cdCancel" class="btn">취소</button>
        <button type="submit" class="btn btn--primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 데이터를 못 불러왔을 때(서버 설정·DB 미설정 등) 보여 주는 안내 -->
  <section id="loadError" class="load-error" role="alert" hidden>
    <h1>기록을 불러오지 못했어요</h1>
    <p id="loadErrorMsg" class="muted"></p>
    <p class="muted small">Supabase에서 <code>supabase/history.sql</code>을 아직 실행하지 않았다면 먼저 실행해 주세요.</p>
    <button type="button" id="retryBtn" class="btn btn--primary">다시 시도</button>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="/history/api.js"></script>
  <script src="/history/app.js"></script>
</body>
</html>
