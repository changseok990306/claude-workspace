<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>어도비</title>
  <meta name="description" content="어도비 광고 계정 캠페인별 히스토리·소재일정·업무 체크리스트 관리">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Crect x='6' y='17' width='5' height='9' rx='1.5' fill='%23fff'/%3E%3Crect x='13.5' y='11' width='5' height='15' rx='1.5' fill='%23fff'/%3E%3Crect x='21' y='6' width='5' height='20' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
  <!-- 깜빡임 방지: 화면이 그려지기 전에 저장된(또는 OS) 테마를 먼저 적용 -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ads.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="index.html" aria-label="어도비 홈">
        <img class="brand__logo" src="img/adobe-mark.svg" alt="" width="30" height="27">
        <span class="brand__text"><strong>어도비</strong><small>ADOBE</small></span>
      </a>
      <div class="topbar__actions">
        <button type="button" id="dataBtn" class="btn btn--sm">데이터</button>
        <button type="button" id="themeSwitch" class="switch" role="switch" aria-checked="false" aria-label="다크 모드">
          <span class="switch__thumb" aria-hidden="true"></span>
        </button>
      </div>
    </div>
    <nav class="tabs" aria-label="메뉴">
      <div class="tabs__inner" role="tablist">
        <button type="button" role="tab" class="tab" data-tab="records" aria-selected="false">히스토리</button>
        <button type="button" role="tab" class="tab" data-tab="creatives" aria-selected="false">소재일정</button>
        <button type="button" role="tab" class="tab" data-tab="tasks" aria-selected="false">체크리스트</button>
      </div>
    </nav>
  </header>

  <div id="banner" class="banner" role="alert" hidden></div>

  <main class="layout">
    <aside class="sidebar" aria-label="캠페인 목록">
      <div class="sidebar__head">
        <h2>캠페인</h2>
        <button type="button" id="newCampaignBtn" class="btn btn--sm">+ 새 캠페인</button>
      </div>
      <ul id="campaignList" class="campaigns"></ul>
    </aside>

    <section class="content">
      <div class="page-title" id="pageTitle" data-c="all">
        <div>
          <h1 id="titleText">전체 캠페인</h1>
          <p id="titleSub" class="muted"></p>
        </div>
        <div class="page-title__actions" id="titleActions" hidden>
          <button type="button" id="editCampaignBtn" class="btn btn--sm">이름·색상 수정</button>
          <button type="button" id="deleteCampaignBtn" class="btn btn--sm btn--danger">캠페인 삭제</button>
        </div>
      </div>

      <div id="view-records" class="view" role="tabpanel" hidden></div>
      <div id="view-creatives" class="view" role="tabpanel" hidden></div>
      <div id="view-tasks" class="view" role="tabpanel" hidden></div>
    </section>
  </main>

  <!-- 캠페인 추가/수정 -->
  <dialog id="campaignDialog" class="dialog">
    <form id="campaignForm" method="dialog" autocomplete="off">
      <h2 id="cdTitle">새 캠페인</h2>
      <label class="field">
        <span>이름 (최대 40자)</span>
        <input type="text" id="cdName" maxlength="40" required>
      </label>
      <fieldset class="field">
        <legend>색상 톤</legend>
        <div id="cdColors" class="swatches" role="radiogroup" aria-label="색상 톤"></div>
      </fieldset>
      <div class="dialog__foot">
        <button type="button" id="cdCancel" class="btn">취소</button>
        <button type="submit" class="btn btn--primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 데이터(가져오기·내보내기·백업) 창은 js/data.js 가 만듭니다 -->
  <dialog id="dataDialog" class="dialog dialog--wide" aria-labelledby="ddTitle"></dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/calc.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/records.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/creatives.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
